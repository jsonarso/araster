<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="thermal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6cff"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#27e0a0"/>
      <stop offset="75%" stop-color="#fbe13d"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1c1c22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b0b0f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(830, 80)">
    <circle cx="190" cy="230" r="150" fill="none" stroke="#2a2a33" stroke-width="1.5"/>
    <circle cx="190" cy="230" r="92" fill="none" stroke="url(#thermal)" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="190" y1="30" x2="190" y2="430" stroke="#ff8a3d" stroke-width="1.5"/>
    <line x1="-10" y1="230" x2="390" y2="230" stroke="#ff8a3d" stroke-width="1.5"/>
    <rect x="140" y="180" width="100" height="100" fill="none" stroke="url(#thermal)" stroke-width="3" transform="rotate(20 190 230)"/>
  </g>

  <text x="70" y="250" font-family="Georgia, serif" font-size="30" fill="#ff8a3d" letter-spacing="1">PAT. Nº AR-03D</text>
  <text x="70" y="330" font-family="Georgia, serif" font-weight="600" font-size="78" fill="#ece9e2">Araster</text>
  <text x="70" y="390" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#8f8d9a">Impresión 3D — funcional, decorativo, a medida</text>
  <text x="70" y="450" font-family="Courier New, monospace" font-size="18" fill="#ff8a3d" letter-spacing="3">ARASTER.PAGES.DEV</text>
</svg>
